[package]
name = "stegoslop-cli"
version = "0.1.0"
edition = "2021"
description = "StegoSlop CLI - Multi-carrier steganography tool (images, audio, zero-width text)"
license = "GPL-3.0"
default-run = "stegoslop"

[lib]
name = "stegoslop_cli"
path = "src/lib.rs"

[[bin]]
name = "stegoslop"
path = "src/bin/stegoslop.rs"

[[bin]]
name = "stegoslop-cli"
path = "src/bin/stegoslop-cli.rs"

[dependencies]
stegoslop-core = { path = "../stegoslop-core" }
clap = { version = "4.5", features = ["derive", "cargo"] }
anyhow = "1.0"
image = { version = "0.25", default-features = false, features = ["png"] }
hound = "3.5"
crc32fast = "1.4"

[dev-dependencies]
tempfile = "3.10"
